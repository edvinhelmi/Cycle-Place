openapi: 3.0.3
info:
  title: Cycle Place API
  description: Backend API per la gestione di rastrelliere, parcheggi protetti, preferiti utente, segnalazioni e routing ciclabile.
  version: 1.0.0

servers:
  - url: http://localhost:3000
    description: Server locale di sviluppo

paths:
  /api/v1/rastrelliere:
    get:
      summary: Recupera tutte le rastrelliere con telemetria smart IoT
      tags: [Dati Spaziali]
      responses:
        '200':
          description: GeoJSON FeatureCollection con rastrelliere e telemetria
        '500':
          description: Errore del server nel caricamento del file

  /api/v1/parcheggi:
    get:
      summary: Recupera i parcheggi protetti
      tags: [Dati Spaziali]
      responses:
        '200':
          description: GeoJSON FeatureCollection dei parcheggi protetti
        '500':
          description: Errore nel caricamento del dataset

  /api/v1/config:
    get:
      summary: Restituisce la configurazione pubblica (Google Client ID)
      tags: [Configurazione]
      responses:
        '200':
          description: Client ID di Google

  /api/v1/register:
    post:
      summary: Registra un nuovo utente locale
      tags: [Autenticazione]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, surname, email, password]
              properties:
                name:
                  type: string
                surname:
                  type: string
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        '201':
          description: Registrazione completata
        '400':
          description: Campi non validi
        '409':
          description: Utente già registrato

  /api/v1/login:
    post:
      summary: Login utente con rilascio di Access Token e Refresh Token
      tags: [Autenticazione]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: Login effettuato con successo
        '401':
          description: Credenziali non valide
        '429':
          description: Rate limit attivo

  /api/v1/refresh-token:
    post:
      summary: Rinnova l'access token tramite il refresh token
      tags: [Autenticazione]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: Nuovo Access Token generato
        '401':
          description: Token mancante
        '403':
          description: Token non valido o revocato

  /api/v1/forgot-password:
    post:
      summary: Richiede il link per la reimpostazione della password
      tags: [Autenticazione]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                lang:
                  type: string
                  enum: [it, en, de]
      responses:
        '200':
          description: Email inviata

  /api/v1/verify-reset-token:
    get:
      summary: Verifica la validità del token di reset
      tags: [Autenticazione]
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Token valido
        '400':
          description: Token scaduto o non valido

  /api/v1/reset-password:
    post:
      summary: Imposta una nuova password tramite token
      tags: [Autenticazione]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, newPassword]
              properties:
                token:
                  type: string
                newPassword:
                  type: string
      responses:
        '200':
          description: Password aggiornata

  /api/v1/auth/google:
    post:
      summary: Login o registrazione tramite Google SSO
      tags: [Autenticazione]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [credential]
              properties:
                credential:
                  type: string
      responses:
        '200':
          description: Autenticazione completata

  /api/v1/auth/verify:
    get:
      summary: Verifica l'Access Token corrente
      tags: [Autenticazione]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Token valido
        '401':
          description: Non autorizzato

  /api/v1/user/me:
    get:
      summary: Ottiene il profilo dell'utente loggato
      tags: [Utente]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Profilo utente

  /api/v1/user/profile:
    put:
      summary: Modifica dati anagrafici, cambio password e notifiche
      tags: [Utente]
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                surname:
                  type: string
                currentPassword:
                  type: string
                newPassword:
                  type: string
                notificheEmail:
                  type: boolean
      responses:
        '200':
          description: Profilo aggiornato

  /api/v1/user/account:
    delete:
      summary: Cancellazione definitiva account (GDPR)
      tags: [Utente]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Account eliminato

  /api/v1/user/preferiti:
    get:
      summary: Lista dei preferiti dell'utente
      tags: [Preferiti]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Array dei preferiti
    post:
      summary: Aggiunge un elemento ai preferiti
      tags: [Preferiti]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rastrellieraId]
              properties:
                rastrellieraId:
                  type: integer
                tipologia:
                  type: string
                stalli:
                  type: integer
                zona:
                  type: string
                lat:
                  type: number
                lng:
                  type: number
      responses:
        '201':
          description: Aggiunto ai preferiti

  /api/v1/user/preferiti/{id}:
    delete:
      summary: Rimuove un elemento dai preferiti
      tags: [Preferiti]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Rimosso dai preferiti

  /api/v1/segnalazioni:
    post:
      summary: Invia una nuova segnalazione di guasto
      tags: [Segnalazioni]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rastrellieraId, tipo]
              properties:
                rastrellieraId:
                  type: integer
                tipo:
                  type: string
                note:
                  type: string
                lat:
                  type: number
                lng:
                  type: number
      responses:
        '201':
          description: Segnalazione registrata

  /api/v1/segnalazioni/user:
    get:
      summary: Storico segnalazioni dell'utente
      tags: [Segnalazioni]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista segnalazioni utente

  /api/v1/segnalazioni/recenti:
    get:
      summary: Segnalazioni pubbliche delle ultime 48 ore
      tags: [Segnalazioni]
      responses:
        '200':
          description: Lista segnalazioni anonimizzate

  /api/v1/routing:
    get:
      summary: Calcola il percorso ciclabile o a piedi
      tags: [Routing]
      parameters:
        - name: startLat
          in: query
          required: true
          schema:
            type: number
        - name: startLng
          in: query
          required: true
          schema:
            type: number
        - name: endLat
          in: query
          required: true
          schema:
            type: number
        - name: endLng
          in: query
          required: true
          schema:
            type: number
        - name: profile
          in: query
          schema:
            type: string
            enum: [cycling-regular, foot-walking, driving-car]
        - name: language
          in: query
          schema:
            type: string
            enum: [it, en, de]
      responses:
        '200':
          description: Tracciato GeoJSON calcolato
        '400':
          description: Coordinate mancanti o non valide

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT