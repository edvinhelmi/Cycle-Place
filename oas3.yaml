openapi: 3.0.0
info:
  version: '1.0.0'
  title: 'Cycle Place Web APIs'
  description: 'API RESTful per la consultazione della rete ciclabile urbana di Trento, calcolo del percorso (routing), gestione preferiti e segnalazioni guasti della community.'
  license:
    name: MIT
servers:
  - url: http://localhost:3000/api/v1
    description: Server Locale di Sviluppo
  - url: https://cycle-place.onrender.com/api/v1
    description: Server Cloud di Produzione

paths:
  /rastrelliere:
    get:
      summary: 'Elenco rastrelliere geolocalizzate'
      description: 'Restituisce la FeatureCollection GeoJSON convertita da EPSG:25832 in WGS84 con telemetria IoT simulata.'
      responses:
        '200':
          description: 'Collezione GeoJSON rastrelliere recuperata con successo.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeoJsonCollection'
        '500':
          description: 'Errore interno nel caricamento dei dati spaziali.'

  /parcheggi:
    get:
      summary: 'Elenco parcheggi protetti'
      description: 'Restituisce i parcheggi e box protetti in formato GeoJSON WGS84 con ID univoco normalizzato.'
      responses:
        '200':
          description: 'Dati dei parcheggi protetti recuperati con successo.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeoJsonCollection'
        '500':
          description: 'Errore interno nel caricamento dei dati spaziali.'

  /config:
    get:
      summary: 'Configurazione client'
      description: 'Restituisce le chiavi pubbliche di configurazione runtime (es. Google Client ID).'
      responses:
        '200':
          description: 'Parametri di configurazione client restituiti con successo.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  googleClientId:
                    type: string

  /register:
    post:
      summary: 'Registrazione nuovo utente'
      description: 'Registra un nuovo account con password cifrata tramite bcrypt e invio email di benvenuto.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, surname, email, password]
              properties:
                name:
                  type: string
                  example: Mario
                surname:
                  type: string
                  example: Rossi
                email:
                  type: string
                  format: email
                  example: mario.rossi@unitn.it
                password:
                  type: string
                  minLength: 8
                  example: Password!2026
      responses:
        '201':
          description: 'Utente registrato con successo.'
        '400':
          description: 'Dati mancanti o password non conforme ai criteri di sicurezza.'
        '409':
          description: 'Indirizzo email già registrato nel sistema.'

  /login:
    post:
      summary: 'Autenticazione utente locale'
      description: 'Verifica le credenziali email/password e rilascia Access Token JWT e Refresh Token.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  example: mario.rossi@unitn.it
                password:
                  type: string
                  example: Password!2026
      responses:
        '200':
          description: 'Login eseguito con successo.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
                  refreshToken:
                    type: string
                  user:
                    $ref: '#/components/schemas/UserProfile'
        '400':
          description: 'Email o password non fornite.'
        '401':
          description: 'Credenziali non valide o errate.'
        '429':
          description: 'Troppi tentativi consecutivi (Rate Limit).'

  /refresh-token:
    post:
      summary: 'Rinnovo Access Token'
      description: 'Riceve un Refresh Token valido e rilascia un nuovo Access Token senza forzare il re-login.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: 'Nuovo Access Token rilasciato con successo.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
        '401':
          description: 'Refresh token mancante o non autorizzato.'
        '403':
          description: 'Refresh token non valido o scaduto.'

  /auth/google:
    post:
      summary: 'Autenticazione Google SSO'
      description: 'Verifica l ID Token emesso da Google OAuth2 ed autentica o crea l account utente.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [credential]
              properties:
                credential:
                  type: string
      responses:
        '200':
          description: 'Autenticazione federata convalidata con successo.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
                  refreshToken:
                    type: string
                  user:
                    $ref: '#/components/schemas/UserProfile'
        '401':
          description: 'Token Google non valido o scaduto.'

  /auth/verify:
    get:
      summary: 'Verifica validità token JWT'
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 'Token valido e sessione attiva.'
        '401':
          description: 'Token mancante o non valido.'

  /forgot-password:
    post:
      summary: 'Richiesta reset password'
      description: 'Genera un token crittografico monouso e invia email per il recupero credenziali.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                lang:
                  type: string
                  enum: [it, en, de]
                  default: it
      responses:
        '200':
          description: 'Email di ripristino inviata (se l account esiste).'
        '400':
          description: 'Indirizzo email non valido.'

  /verify-reset-token:
    get:
      summary: 'Verifica validità token di reset'
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 'Token valido e non ancora scaduto.'
        '400':
          description: 'Token non valido o scaduto.'

  /reset-password:
    post:
      summary: 'Impostazione nuova password'
      description: 'Aggiorna la password dell utente consumando il token di reset monouso.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, newPassword]
              properties:
                token:
                  type: string
                newPassword:
                  type: string
                  minLength: 8
      responses:
        '200':
          description: 'Password reimpostata con successo.'
        '400':
          description: 'Token scaduto o password non conforme.'

  /user/me:
    get:
      summary: 'Profilo utente autenticato'
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 'Dati profilo recuperati con successo.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          description: 'Non autorizzato.'

  /user/profile:
    put:
      summary: 'Modifica dati anagrafici e/o password'
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                surname:
                  type: string
                currentPassword:
                  type: string
                newPassword:
                  type: string
                  minLength: 8
      responses:
        '200':
          description: 'Profilo aggiornato con successo.'
        '400':
          description: 'Parametri non validi o password errata.'
        '401':
          description: 'Non autorizzato.'

  /user/account:
    delete:
      summary: 'Cancellazione definitiva account (GDPR)'
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 'Account e dati collegati eliminati con successo.'
        '401':
          description: 'Non autorizzato.'

  /user/preferiti:
    get:
      summary: 'Lista preferiti salvati'
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 'Array dei luoghi preferiti salvati dall utente.'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Preferito'
        '401':
          description: 'Non autorizzato.'
    post:
      summary: 'Aggiunta elemento ai preferiti'
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rastrellieraId]
              properties:
                rastrellieraId:
                  type: integer
                tipologia:
                  type: string
                stalli:
                  type: integer
                zona:
                  type: string
                lat:
                  type: number
                lng:
                  type: number
      responses:
        '201':
          description: 'Elemento aggiunto ai preferiti.'
        '409':
          description: 'Elemento già presente nei preferiti.'
        '401':
          description: 'Non autorizzato.'

  /user/preferiti/{id}:
    delete:
      summary: 'Rimozione elemento dai preferiti'
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 'Elemento rimosso dai preferiti.'
        '404':
          description: 'Preferito non trovato.'
        '401':
          description: 'Non autorizzato.'

  /segnalazioni:
    post:
      summary: 'Invio nuova segnalazione disservizio'
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rastrellieraId, tipo]
              properties:
                rastrellieraId:
                  type: integer
                tipo:
                  type: string
                  enum: [bici_abbandonata, danno_strutturale, rastrelliera_piena, vandalismo, altro]
                note:
                  type: string
                lat:
                  type: number
                lng:
                  type: number
      responses:
        '201':
          description: 'Segnalazione registrata con successo.'
        '400':
          description: 'Dati obbligatori mancanti.'
        '401':
          description: 'Non autorizzato.'
        '429':
          description: 'Troppe segnalazioni inviate recentemente.'

  /segnalazioni/user:
    get:
      summary: 'Segnalazioni inviate dall utente'
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 'Lista delle segnalazioni dell utente autenticato.'
        '401':
          description: 'Non autorizzato.'

  /segnalazioni/recenti:
    get:
      summary: 'Ultime segnalazioni pubbliche'
      description: 'Restituisce le segnalazioni approvate per l esposizione sulla mappa.'
      responses:
        '200':
          description: 'Elenco segnalazioni recenti.'

  /routing:
    get:
      summary: 'Calcolo percorso turn-by-turn'
      description: 'Calcola il tragitto tra due coordinate WGS84 tramite OpenRouteService o fallback istantaneo OSRM.'
      parameters:
        - name: startLat
          in: query
          required: true
          schema:
            type: number
        - name: startLng
          in: query
          required: true
          schema:
            type: number
        - name: endLat
          in: query
          required: true
          schema:
            type: number
        - name: endLng
          in: query
          required: true
          schema:
            type: number
        - name: profile
          in: query
          required: false
          schema:
            type: string
            enum: [cycling-regular, foot-walking, driving-car]
            default: cycling-regular
        - name: language
          in: query
          required: false
          schema:
            type: string
            enum: [it, en, de]
            default: it
      responses:
        '200':
          description: 'Percorso calcolato con coordinate GeoJSON e manovre turn-by-turn.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeoJsonCollection'
        '400':
          description: 'Coordinate fornite non valide o mancanti.'
        '504':
          description: 'Timeout nel calcolo del percorso.'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    UserProfile:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        surname:
          type: string
        email:
          type: string
        authProvider:
          type: string
          enum: [local, google]

    Preferito:
      type: object
      properties:
        rastrellieraId:
          type: integer
        tipologia:
          type: string
        stalli:
          type: integer
        zona:
          type: string
        lat:
          type: number
        lng:
          type: number

    GeoJsonCollection:
      type: object
      properties:
        type:
          type: string
          example: FeatureCollection
        features:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
                example: Feature
              geometry:
                type: object
                properties:
                  type:
                    type: string
                  coordinates:
                    type: array
              properties:
                type: object
