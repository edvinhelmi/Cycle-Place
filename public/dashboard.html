<!DOCTYPE html>
<html lang="it" data-theme="trento">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard — Cycle Place</title>
    <!-- FontAwesome Free (Locale & CDN Fallback) -->
    <link rel="stylesheet" href="fontawesome/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <!-- Flag Icons (SVG Bandiere) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/lipis/flag-icons@7.0.0/css/flag-icons.min.css"/>
    <!-- Tailwind CSS + DaisyUI (Locale) -->
    <link rel="stylesheet" href="css/tailwind.css">
    <link rel="stylesheet" href="css/dashboard.css">
</head>
<body class="bg-base-200 text-slate-800 antialiased min-h-screen flex flex-col">
    <!-- Navbar coerente con la pagina principale (RNF1, RNF6) -->
    <header class="navbar glass-navbar px-4 sm:px-6 py-2.5 z-[2000] sticky top-0 flex justify-between items-center">
        <div class="logo font-bold text-xl text-primary flex items-center gap-2.5 tracking-tight">
            <i class="fa-solid fa-bicycle text-2xl text-primary"></i>
            <span>Cycle-Place</span>
        </div>

        <button id="btn-hamburger" class="hamburger-btn btn btn-square btn-ghost btn-sm text-slate-700 md:hidden" aria-label="Menu" aria-expanded="false">
            <span class="hamburger-icon text-lg"><i class="fa-solid fa-bars"></i></span>
        </button>

        <div class="user-controls flex items-center gap-2.5" id="user-controls">
            <span id="dash-greeting" class="user-greeting badge badge-lg bg-primary/10 text-primary border-primary/20 py-3.5 px-3.5 gap-2 font-semibold">
                <i class="fa-solid fa-circle-user"></i> Ciao, <strong id="dash-user-name">Utente</strong>!
            </span>
            <a href="/" class="btn btn-secondary btn-sm rounded-xl font-semibold shadow-sm text-white" data-i18n="nav.backToMap">
                <i class="fa-solid fa-arrow-left"></i> <span>Torna alla Mappa</span>
            </a>
            <button id="dash-logout" class="btn btn-outline btn-error btn-sm rounded-xl font-semibold" data-i18n="nav.logout">
                <i class="fa-solid fa-right-from-bracket"></i> <span>Logout</span>
            </button>
            <!-- Selettore lingua con hitbox a tutta ampiezza (100% cliccabile) -->
            <div class="lang-selector-wrapper relative flex items-center justify-between gap-1.5 bg-base-100/90 hover:bg-base-200/80 border border-base-300 rounded-xl px-2.5 py-1.5 shadow-xs transition-colors select-none cursor-pointer">
                <div class="flex items-center gap-1.5 pointer-events-none">
                    <span id="lang-flag-icon" class="fi fi-it text-base rounded-xs shadow-xs"></span>
                    <span id="lang-selected-code" class="text-xs font-bold text-slate-700 uppercase">IT</span>
                    <i class="fa-solid fa-chevron-down text-[9px] text-slate-400"></i>
                </div>
                <select id="lang-select" class="lang-select absolute inset-0 w-full h-full opacity-0 cursor-pointer z-20" aria-label="Seleziona lingua">
                    <option value="it">Italiano (IT)</option>
                    <option value="en">English (EN)</option>
                    <option value="de">Deutsch (DE)</option>
                </select>
            </div>
        </div>
    </header>

    <main class="dash-main max-w-4xl w-full mx-auto p-4 sm:p-6 space-y-6 flex-1">
        <!-- Profilo Utente -->
        <section class="dash-card card glass-box shadow-xl rounded-3xl p-5 sm:p-7 border border-white/60">
            <h2 class="card-title text-lg sm:text-xl font-bold text-slate-800 pb-2.5 border-b border-base-200/80 mb-3.5 flex items-center gap-2.5">
                <i class="fa-solid fa-user text-primary"></i> <span data-i18n="dash.profile">Profilo</span>
            </h2>
            <div id="profile-info" class="profile-grid grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div class="profile-item bg-base-100/80 border border-base-200/80 rounded-xl py-2 px-3.5 sm:py-2.5 sm:px-4 flex flex-col gap-0.5 shadow-xs">
                    <label class="text-[11px] font-bold text-slate-400 uppercase tracking-wider" data-i18n="dash.name">Nome</label>
                    <span id="p-name" class="text-sm sm:text-base font-bold text-slate-800 leading-snug">—</span>
                </div>
                <div class="profile-item bg-base-100/80 border border-base-200/80 rounded-xl py-2 px-3.5 sm:py-2.5 sm:px-4 flex flex-col gap-0.5 shadow-xs">
                    <label class="text-[11px] font-bold text-slate-400 uppercase tracking-wider" data-i18n="dash.surname">Cognome</label>
                    <span id="p-surname" class="text-sm sm:text-base font-bold text-slate-800 leading-snug">—</span>
                </div>
                <div class="profile-item bg-base-100/80 border border-base-200/80 rounded-xl py-2 px-3.5 sm:py-2.5 sm:px-4 flex flex-col gap-0.5 shadow-xs">
                    <label class="text-[11px] font-bold text-slate-400 uppercase tracking-wider">Email</label>
                    <span id="p-email" class="text-sm sm:text-base font-bold text-slate-800 break-all leading-snug">—</span>
                </div>
                <div class="profile-item bg-base-100/80 border border-base-200/80 rounded-xl py-2 px-3.5 sm:py-2.5 sm:px-4 flex flex-col gap-0.5 shadow-xs">
                    <label class="text-[11px] font-bold text-slate-400 uppercase tracking-wider" data-i18n="dash.provider">Accesso via</label>
                    <span id="p-provider" class="text-sm sm:text-base font-bold text-slate-800 flex items-center gap-2 leading-snug">—</span>
                </div>
            </div>
        </section>


        <!-- Preferiti -->
        <section class="dash-card card glass-box shadow-xl rounded-3xl p-6 sm:p-8 border border-white/60">
            <h2 class="card-title text-lg sm:text-xl font-bold text-slate-800 pb-3 border-b border-base-200/80 mb-4 flex items-center gap-2.5">
                <i class="fa-solid fa-heart text-error"></i> <span data-i18n="dash.favourites">Rastrelliere Preferite</span>
            </h2>
            <div id="preferiti-list" class="item-list space-y-3">
                <p class="empty-msg alert bg-base-100/70 border border-base-200 text-slate-500 font-medium text-sm rounded-2xl" data-i18n="dash.noFavourites">Nessuna rastrelliera salvata ancora.</p>
            </div>
        </section>

        <!-- Segnalazioni -->
        <section class="dash-card card glass-box shadow-xl rounded-3xl p-6 sm:p-8 border border-white/60">
            <h2 class="card-title text-lg sm:text-xl font-bold text-slate-800 pb-3 border-b border-base-200/80 mb-4 flex items-center gap-2.5">
                <i class="fa-solid fa-clipboard-list text-info"></i> <span data-i18n="dash.reports">Le Mie Segnalazioni</span>
            </h2>
            <div id="segnalazioni-list" class="item-list space-y-3">
                <p class="empty-msg alert bg-base-100/70 border border-base-200 text-slate-500 font-medium text-sm rounded-2xl" data-i18n="dash.noReports">Nessuna segnalazione inviata.</p>
            </div>
        </section>
    </main>

    <script src="js/i18n.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
